name: FootyLab Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate curated player and club data
        run: npm run check:data
      - name: Validate relational database and media rights
        run: npm run check:db
      - name: Validate JSON database export
        run: |
          npm run db:export
          test -s data/exports/players.json
          test -s data/exports/clubs.json
          test -s data/exports/career-history.json
          test -s data/exports/media.json
      - name: Compile and build
        run: npm run build
